<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg" opacity="0.15">
  <defs>
    <radialGradient id="grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Nodes -->
  <circle cx="100" cy="150" r="10" fill="#ffffff" />
  <circle cx="250" cy="80" r="8" fill="#ffffff" />
  <circle cx="350" cy="220" r="12" fill="#ffffff" />
  <circle cx="500" cy="120" r="15" fill="#ffffff" />
  <circle cx="650" cy="250" r="9" fill="#ffffff" />
  <circle cx="200" cy="300" r="11" fill="#ffffff" />
  
  <!-- Connections -->
  <line x1="100" y1="150" x2="250" y2="80" stroke="#ffffff" stroke-width="1.5" />
  <line x1="250" y1="80" x2="500" y2="120" stroke="#ffffff" stroke-width="1.5" />
  <line x1="500" y1="120" x2="350" y2="220" stroke="#ffffff" stroke-width="1.5" />
  <line x1="350" y1="220" x2="650" y2="250" stroke="#ffffff" stroke-width="1.5" />
  <line x1="100" y1="150" x2="200" y2="300" stroke="#ffffff" stroke-width="1.5" />
  <line x1="200" y1="300" x2="350" y2="220" stroke="#ffffff" stroke-width="1.5" />
  <line x1="500" y1="120" x2="650" y2="250" stroke="#ffffff" stroke-width="1.5" />
  
  <!-- Subtle network dots -->
  <circle cx="170" cy="115" r="3" fill="#ffffff" />
  <circle cx="420" cy="170" r="4" fill="#ffffff" />
  <circle cx="580" cy="180" r="3" fill="#ffffff" />
</svg>
